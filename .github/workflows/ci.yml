name: CI

on:
  push:
    branches: [main, master, data-layer-trust-refactor]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Inspirella_code_AI.Studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Inspirella_code_AI.Studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
